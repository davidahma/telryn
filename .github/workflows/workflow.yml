name: Publish Python package

on:
  # GitHub loads workflow_run from the default branch. A release event itself
  # uses the workflow at the tag, which is a different trust boundary.
  workflow_run:
    workflows: [Notify published release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable, signed release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: pypi-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'release' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      wheel: ${{ steps.hashes.outputs.wheel }}
      sdist: ${{ steps.hashes.outputs.sdist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - name: Require an immutable release of the CI-qualified main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$commit" "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            test "$commit" = "$RELEASE_SHA"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" |
            jq -e --arg sha "$commit" '.immutable and (.draft | not) and .target_commitish == $sha'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&event=push&branch=main" |
            jq -e --arg sha "$commit" 'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")'
          source_name="telryn-${TAG#v}.tar.gz"
          audit_dir="$RUNNER_TEMP/signed-source"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$audit_dir" \
            -p "$source_name" -p SHA256SUMS.txt -p SHA256SUMS.sigstore.json
          cosign verify-blob --bundle "$audit_dir/SHA256SUMS.sigstore.json" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-container.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$audit_dir/SHA256SUMS.txt"
          signed_hash=$(awk -v file="$source_name" '$2 == file {print $1}' "$audit_dir/SHA256SUMS.txt")
          test "$signed_hash" = "$(sha256sum "$audit_dir/$source_name" | cut -d' ' -f1)"
          python -I scripts/release_artifacts.py source "$audit_dir/$source_name" "$TAG" "$commit"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Check out the verified product commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          path: product
          persist-credentials: false
      - name: Build and exercise the exact files for publication
        working-directory: product
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(python -m telryn --version)" = "$VERSION"
          python -m pip install build twine
          bash scripts/check_distributions.sh "$RUNNER_TEMP/dist" "$VERSION"
      - id: hashes
        run: |
          cd "$RUNNER_TEMP/dist"
          echo "wheel=$(sha256sum ./*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist=$(sha256sum ./*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/telryn/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: dist/
      - name: Upload only missing distributions with the tested hashes
        id: pending
        env:
          VERSION: ${{ needs.build.outputs.version }}
          WHEEL: ${{ needs.build.outputs.wheel }}
          SDIST: ${{ needs.build.outputs.sdist }}
        run: |
          set -euo pipefail
          cd dist
          wheel="telryn-$VERSION-py3-none-any.whl"
          sdist="telryn-$VERSION.tar.gz"
          shopt -s dotglob nullglob
          files=(*)
          test "${#files[@]}" -eq 2
          printf '%s  %s\n' "$WHEEL" "$wheel" "$SDIST" "$sdist" | sha256sum --check --strict -
          record="$RUNNER_TEMP/pypi-existing.json"
          status=$(curl -sSL --retry 4 --retry-all-errors -o "$record" -w '%{http_code}' \
            "https://pypi.org/pypi/telryn/$VERSION/json?preflight=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          case "$status" in
            404) ;; # First upload for this version.
            200)
              jq -e --arg w "$wheel" --arg s "$sdist" --arg wh "$WHEEL" --arg sh "$SDIST" '
                .urls | type == "array" and all(.[];
                  (.yanked == false) and
                  ((.filename == $w and .digests.sha256 == $wh) or
                   (.filename == $s and .digests.sha256 == $sh)))' "$record"
              for file in "$wheel" "$sdist"; do
                if jq -e --arg f "$file" 'any(.urls[]; .filename == $f)' "$record" > /dev/null; then
                  rm -- "$file"
                fi
              done
              ;;
            *) echo "PyPI inventory returned HTTP $status" >&2; exit 1 ;;
          esac
          if [[ -f "$wheel" || -f "$sdist" ]]; then
            echo 'upload=true' >> "$GITHUB_OUTPUT"
          else
            echo 'upload=false' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pending.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  verify:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WHEEL: ${{ needs.build.outputs.wheel }}
      SDIST: ${{ needs.build.outputs.sdist }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: ${{ runner.temp }}/tested-distributions/
      - name: Compare public hashes and run the PyPI install
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          # A CDN edge can briefly serve a 404 or a partial list after both uploads.
          for attempt in {1..25}; do
            status=$(curl -sSL --max-time 15 --retry 2 -o package.json -w '%{http_code}' \
              "https://pypi.org/pypi/telryn/$VERSION/json?verify=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt")
            case "$status" in
              200)
                jq -e --arg w "$WHEEL" --arg s "$SDIST" --arg v "$VERSION" '
                  .urls | type == "array" and (length <= 2) and
                  (length == (unique_by(.filename) | length)) and all(.[];
                    (.yanked == false) and
                    ((.filename == ("telryn-" + $v + "-py3-none-any.whl") and .digests.sha256 == $w) or
                     (.filename == ("telryn-" + $v + ".tar.gz") and .digests.sha256 == $s)))' package.json
                if jq -e '.urls | length == 2' package.json > /dev/null; then break; fi
                ;;
              404) ;;
              *) echo "Public PyPI verification returned HTTP $status" >&2; exit 1 ;;
            esac
            if (( attempt == 25 )); then echo "Both files have not reached this PyPI edge" >&2; exit 1; fi
            sleep 5
          done
          python -m pip install pypi-attestations==0.0.31
          python -I "$GITHUB_WORKSPACE/release-tools/scripts/verify_pypi.py" "$RUNNER_TEMP/tested-distributions" "$VERSION"
          export PIPX_HOME="$RUNNER_TEMP/pipx" PIPX_BIN_DIR="$RUNNER_TEMP/bin"
          for attempt in {1..12}; do
            if PIP_NO_CACHE_DIR=1 pipx install --python "$(command -v python)" --index-url https://pypi.org/simple "telryn==$VERSION"; then break; fi
            if (( attempt == 12 )); then echo "Fresh pipx install failed" >&2; exit 1; fi
            sleep 5
          done
          test "$("$PIPX_BIN_DIR/telryn" --version)" = "$VERSION"
          "$PIPX_HOME/venvs/telryn/bin/python" -I "$GITHUB_WORKSPACE/scripts/verify_installed.py" "$VERSION"
