name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Qualify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q telryn examples tests
      - run: python -m telryn qualify
      - name: Build and test the installed wheel and source distribution
        if: matrix.python == '3.14'
        run: |
          python -m pip install build twine
          bash scripts/check_distributions.sh "$RUNNER_TEMP/dist" "$(python -m telryn --version)"
      - name: Exercise the Bedrock extra installed from the wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m venv "$RUNNER_TEMP/bedrock"
          wheel=("$RUNNER_TEMP"/dist/*.whl)
          "$RUNNER_TEMP/bedrock/bin/python" -m pip install "${wheel[0]}[bedrock]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/bedrock/bin/python" -I -c 'import boto3, telryn'
          "$RUNNER_TEMP/bedrock/bin/telryn" qualify
      - name: Exercise the QA desk in Google Chrome
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          python -m pip install playwright==1.65.2
          python -m tests.browser_desk
      - name: Build and exercise the private container
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          docker build -t telryn:ci .
          python scripts/container_smoke.py telryn:ci

  offline:
    name: Offline checkout and archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run both source forms inside a network namespace
        shell: bash
        run: |
          set -euo pipefail
          archive_dir="$(mktemp -d)"
          git archive --format=tar.gz --prefix=telryn/ HEAD > "$archive_dir/telryn.tar.gz"
          tar -xzf "$archive_dir/telryn.tar.gz" -C "$archive_dir"
          python="$(command -v python)"
          for tree in "$GITHUB_WORKSPACE" "$archive_dir/telryn"; do
            (
              cd "$tree"
              sudo unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
                "$python" -I -c 'import pathlib, runpy, sys; sys.path.insert(0, str(pathlib.Path.cwd())); sys.argv = ["telryn", "qualify"]; runpy.run_module("telryn", run_name="__main__")'
            )
          done

  windows:
    name: Native Windows support message
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Verify the installed command explains Linux deployment
        shell: bash
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          status=0
          message=$(telryn --help 2>&1) || status=$?
          test "$status" = 2
          [[ "$message" == *"WSL 2 or the signed Linux container"* && "$message" != *"Traceback"* ]]

  verified:
    name: Verified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [qualify, offline, windows]
    steps:
      - name: Require all qualification jobs
        env:
          MATRIX_RESULT: ${{ needs.qualify.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          OFFLINE_RESULT: ${{ needs.offline.result }}
        run: test "$MATRIX_RESULT" = success && test "$OFFLINE_RESULT" = success && test "$WINDOWS_RESULT" = success
