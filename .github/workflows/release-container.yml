name: Sign release and container

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v0.9.0
        type: string
        required: true
      commit:
        description: Exact CI-qualified main commit, 40 hexadecimal characters
        type: string
        required: true

permissions: {}

concurrency:
  group: telryn-sign-release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact tag, draft, version and completed main CI
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{}")" = "$COMMIT"
          test "$(git cat-file -t "refs/tags/$TAG")" = tag
          test "v$(python -m telryn --version)" = "$TAG"
          gh release view "$TAG" --json isDraft,targetCommitish |
            jq -e --arg sha "$COMMIT" '.isDraft and .targetCommitish == $sha'
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&event=push&branch=main&per_page=100" |
            jq -e --arg sha "$COMMIT" 'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")'

  sign:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.57.2
      - name: Build, inventory, sign and verify the selected release
        env:
          TAG: ${{ inputs.tag }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
          SYFT: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: bash scripts/sign_release.sh
