<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly support audit · Telryn</title>
<style>
:root{font-family:"Source Sans 3",system-ui,sans-serif;color:#18332e;background:#f7f6f0;line-height:1.5}
body{margin:0}main{max-width:46rem;margin:auto;padding:2rem 1.4rem 4rem}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #b8bfb3;padding-bottom:1rem}
header b{font-family:Georgia,serif;letter-spacing:-.06em;font-size:1.8rem}header span,small{color:#4c6059}h1,h2{font-family:Georgia,serif;font-weight:500;line-height:1.12}h1{font-size:clamp(2.4rem,7vw,3.7rem);margin:2rem 0 .65rem}h2{font-size:1.7rem;margin:.2rem 0 1rem}p{margin:.4rem 0 1.4rem}section,details{border-top:1px solid #b8bfb3;padding:1.4rem 0}select{font:inherit;padding:.6rem;border:1px solid #99a69b;border-radius:.25rem}label{display:grid;gap:.35rem;font-weight:600;font-size:.95rem;margin-bottom:1rem}input,textarea{max-width:100%;min-width:0;box-sizing:border-box;font:inherit;color:#18332e;padding:.55rem;border:1px solid #99a69b;background:#fffef8;border-radius:.25rem}input[type=file]{width:100%;font-weight:400}
summary{font-weight:600;cursor:pointer}details[open] summary{margin-bottom:1rem}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem}button,.link{display:inline-block;font:inherit;font-weight:650;padding:.65rem 1rem;border-radius:.25rem;border:1px solid #175146;color:white;background:#175146;cursor:pointer;text-decoration:none}button:disabled{opacity:.6}a{color:#15514a}.links{display:flex;align-items:center;gap:1.4rem;margin:1rem 0 1.5rem}#message{font-weight:600;margin-top:1rem}small{font-weight:400}#current{margin-top:2rem}code{overflow-wrap:anywhere}@media(max-width:480px){.pair{grid-template-columns:1fr;gap:0}main{padding-top:1rem}}
</style></head>
<body><main><header><b>Telryn</b><span>Support QA</span></header>
<h1>Weekly support audit</h1><p>Sample the conversations your usual QA review left out.</p>
<details id="history" hidden><summary>Open a saved audit</summary><ul></ul></details>
<form id="intake">
<section><h2>Weekly exports</h2>
<label>Week starting (UTC)<input name="week" type="date" required></label>
<label>Eligible conversations <input name="population" type="file" accept=".csv" required><small>CSV with case_id, revision, evidence_ref and screen_flag.</small></label>
<label>Ordinary human reviews <input name="reviewed" type="file" accept=".csv" required><small>CSV with one case_id per reviewed conversation.</small></label></section>
<section><h2>Review instructions</h2>
<label>Policy template<select id="starter"><option value="">Use your own rubric</option></select><small>Fintech examples are editable. Use a version your policy owner approved.</small></label>
<label>Question for the reviewer<input name="rubric_question" required placeholder="Did the agent close a reported account compromise without the required escalation?"></label>
<div class="pair"><label>Rubric version<input name="rubric" required placeholder="account-escalation-v1"></label>
<label>Screen version<input name="screen_version" value="none" required><small>Use none for a random audit with all flags false.</small></label></div>
<div class="pair"><label>Flagged cases to grade<input name="flagged_sample" type="number" min="0" step="1" required></label>
<label>Unflagged cases to grade<input name="unflagged_sample" type="number" min="0" step="1" required></label></div>
<details><summary>Local model receipt</summary><label>Receipt from Telryn screen<input name="receipt" type="file" accept=".json"></label></details></section>
<button>Create audit</button></form>
<div id="message" role="status" aria-live="polite"></div>
<section id="current" hidden><h2>Review this audit</h2><div class="links"><a id="report" class="link" target="_blank" rel="noopener">Open report</a><a id="packet" download="grades.csv">Download grading CSV</a></div>
<form id="grade"><label>Returned grades<input type="file" name="grades" accept=".csv" required></label><button>Update report</button></form></section>
</main>
<script nonce="SESSION_NONCE">
const intake=document.querySelector('#intake'),grade=document.querySelector('#grade'),message=document.querySelector('#message');
let active='';
function select(id){active=id;document.querySelector('#current').hidden=false;document.querySelector('#report').href=id+'/report.html';document.querySelector('#packet').href=id+'/grades.csv';location.hash=id;}
async function submit(form,url,body){const button=form.querySelector('button');button.disabled=true;message.textContent='Reading the export…';try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw Error(await res.text());select((await res.json()).id);historyList().catch(()=>{});message.textContent=form===intake?'Audit ready. Give the grading CSV to your reviewer.':'Grades recorded. Open the updated report.';document.querySelector('#current').scrollIntoView();}catch(e){message.textContent=e.message;}finally{button.disabled=false;}}
async function values(form){const data={};for(const [key,val] of new FormData(form)){if(val instanceof File){if(val.size>24*1024*1024)throw Error('For exports above 24 MiB, use the CLI.');data[key]=new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(await val.arrayBuffer());}else{data[key]=key.endsWith('_sample')?Number(val):val;}}return data;}
for(const form of [intake,grade]){form.addEventListener('submit',async event=>{event.preventDefault();try{await submit(form,form===intake?'audits':active+'/grades',await values(form));}catch(e){message.textContent=e.message;}});}
async function historyList(){const res=await fetch('audits');if(!res.ok)return;const panel=document.querySelector('#history'),list=panel.querySelector('ul');list.replaceChildren();for(const run of await res.json()){const li=document.createElement('li'),a=document.createElement('a');a.textContent=run.week+' · '+run.rubric+' · '+run.id.slice(0,6);a.href='#'+run.id;a.addEventListener('click',()=>{select(run.id);document.querySelector('#current').scrollIntoView();});li.append(a);list.append(li);}panel.hidden=!list.children.length;}
historyList().catch(()=>{});
async function loadRubrics(){const response=await fetch('rubrics');if(!response.ok)return;const values=await response.json(),field=document.querySelector('#starter');for(const [key,preset] of Object.entries(values)){field.add(new Option(preset[0],key));}field.addEventListener('change',()=>{if(values[field.value]){intake.elements.rubric_question.value=values[field.value][1];intake.elements.rubric.value='fintech-'+field.value+'-v1';}});}
loadRubrics().catch(()=>{});
if(/^#[a-f0-9]{24}$/.test(location.hash))select(location.hash.slice(1));
</script></body></html>
